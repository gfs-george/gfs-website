  <style>
    :root { --nav-logo-height: 120px; }
    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; }

  <!-- Three.js is SELF-HOSTED (assets/vendor/three); importmap resolves the
       bare 'three' specifier used by GLTFLoader. Root-relative paths so this
       page works no matter what URL Apache served the 404 for. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/assets/vendor/three/three.module.min.js",
      "three/addons/": "/assets/vendor/three/addons/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const canvas = document.getElementById('nf-canvas');
    const hero = canvas.parentElement;
    let W = hero.clientWidth, H = hero.clientHeight;

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 100);
    camera.position.set(0, 0.5, 7);

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    scene.add(new THREE.AmbientLight(0xffffff, 0.08));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);  keyLight.position.set(4, 8, 6);   scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xcccccc, 0.4);  fillLight.position.set(-6, 0, 4); scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0x888888, 0.5);   rimLight.position.set(0, -6, -4); scene.add(rimLight);
    const greenLight = new THREE.PointLight(0x94D500, 5.5, 20);   greenLight.position.set(-4, -1, 5); scene.add(greenLight);

    let knight = null, knightMaxDim = 1;
    const loader = new GLTFLoader();
    loader.load('/assets/logos/GFS_Mesh3D_ChessPiece.glb', (gltf) => {
      knight = gltf.scene;
      const box = new THREE.Box3().setFromObject(knight);
      const center = new THREE.Vector3(); box.getCenter(center); knight.position.sub(center);
      const size = new THREE.Vector3(); box.getSize(size); knightMaxDim = Math.max(size.x, size.y, size.z);
      knight.traverse(c => { if (c.isMesh) {
        c.material = new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 0.92, roughness: 0.22, transparent: true, opacity: 0.72 });
      }});
      knight.scale.setScalar((W < 768 ? 3.0 : 4.4) / knightMaxDim);
      scene.add(knight);
    }, undefined, (err) => console.error('GLB load error:', err));

    let t = 0;
    (function tick(){
      requestAnimationFrame(tick);
      t += 0.007;
      if (knight) {
        knight.rotation.y = Math.sin(t * 0.42) * 0.65;
        knight.rotation.z = Math.sin(t * 0.26) * 0.04;
        knight.position.y = Math.sin(t * 0.55) * 0.18;
      }
      greenLight.position.x = Math.cos(t * 0.32) * 5 - 1;
      greenLight.position.z = Math.sin(t * 0.32) * 4 + 3;
      renderer.render(scene, camera);
    })();

    new ResizeObserver(() => {
      W = hero.clientWidth; H = hero.clientHeight;
      camera.aspect = W / H; camera.updateProjectionMatrix();
      renderer.setSize(W, H);
      if (knight) knight.scale.setScalar((W < 768 ? 3.0 : 4.4) / knightMaxDim);
    }).observe(hero);
  </script>
</head>
