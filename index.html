  <!-- Import map: resolves bare 'three' specifier used inside GLTFLoader.js -->

  <!-- Three.js + GLTFLoader via ES module, exposes window.__initKnight() -->
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';

    window.__initKnight = function(canvas) {
      const hero = canvas.parentElement;
      let W = hero.clientWidth;
      let H = hero.clientHeight;

      /* Scene + camera */
      const scene  = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 100);
      camera.position.set(0, 0.5, 7);

      /* Renderer, transparent bg */
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(W, H);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      /* ── Lighting ── */
      scene.add(new THREE.AmbientLight(0xffffff, 0.08));

      const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
      keyLight.position.set(4, 8, 6);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xcccccc, 0.4);
      fillLight.position.set(-6, 0, 4);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight(0x888888, 0.5);
      rimLight.position.set(0, -6, -4);
      scene.add(rimLight);

      // GFS brand green, orbits slowly for dynamic sheen
      const greenLight = new THREE.PointLight(0x94D500, 5.5, 20);
      greenLight.position.set(-4, -1, 5);
      scene.add(greenLight);

      /* ── Responsive knight state ── */
      let knight        = null;
      let knightMaxDim  = 1;
      let knightOffsetX = -0.5;
      let knightOffsetY = 0;
      let knightFloatAmp = 0.22;   // vertical drift in world units

      function applyViewport() {
        if (!knight) return;
        // Match the CSS breakpoint where the hero collapses to a single column.
        const mobile = W < 960;
        if (mobile) {
          knight.scale.setScalar(0.95 / knightMaxDim);
          knightOffsetX = 0.7;
          knightOffsetY = 2.05;
          knightFloatAmp = 0.05;   // very tight float so the piece never overlaps the portal cards
        } else {
          knight.scale.setScalar(2.72 / knightMaxDim);
          knightOffsetX = -0.5;
          knightOffsetY = 0;
          knightFloatAmp = 0.22;
        }
        knight.position.x = knightOffsetX;
      }

      /* ── Load GLB model ── */
      const loader = new GLTFLoader();

      loader.load(
        'assets/logos/GFS_Mesh3D_ChessPiece.glb',
        (gltf) => {
          knight = gltf.scene;

          // Centre the model on its bounding box
          const box    = new THREE.Box3().setFromObject(knight);
          const center = new THREE.Vector3();
          box.getCenter(center);
          knight.position.sub(center);

          // Store maxDim for responsive scaling
          const size = new THREE.Vector3();
          box.getSize(size);
          knightMaxDim = Math.max(size.x, size.y, size.z);

          // Override all meshes with GFS dark metallic material
          knight.traverse(child => {
            if (child.isMesh) {
              child.material = new THREE.MeshStandardMaterial({
                color:       0x000000,
                metalness:   0.92,
                roughness:   0.22,
                transparent: true,
                opacity:     0.72,
              });
            }
          });

          scene.add(knight);
          applyViewport();
        },
        undefined,
        (err) => console.error('GLB load error:', err)
      );

      /* ── Animation loop ── */
      let t   = 0;
      let raf = null;

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const tick = () => {
        raf = requestAnimationFrame(tick);

        // Skip animation math when motion is reduced, render a still frame
        if (!reducedMotion) {
          t += 0.007;

          if (knight) {
            knight.rotation.y = Math.sin(t * 0.42) * 0.65;
            knight.rotation.z = Math.sin(t * 0.26) * 0.04;
            knight.position.y = knightOffsetY + Math.sin(t * 0.55) * knightFloatAmp;
          }

          // Orbit green light for dynamic reflections
          greenLight.position.x = Math.cos(t * 0.32) * 5 - 1;
          greenLight.position.z = Math.sin(t * 0.32) * 4 + 3;
        }

        renderer.render(scene, camera);
      };
      tick();

      /* Pause render loop when tab is hidden (saves battery / CPU) */
      const onVisibility = () => {
        if (document.hidden) {
          if (raf) cancelAnimationFrame(raf);
          raf = null;
        } else if (!raf) {
          tick();
        }
      };
      document.addEventListener('visibilitychange', onVisibility);

      /* ── Resize ── */
      const ro = new ResizeObserver(() => {
        W = hero.clientWidth;
        H = hero.clientHeight;
        camera.aspect = W / H;
        camera.updateProjectionMatrix();
        renderer.setSize(W, H);
        applyViewport();
      });
      ro.observe(hero);

      /* ── Return cleanup fn ── */
      return () => {
        if (raf) cancelAnimationFrame(raf);
        document.removeEventListener('visibilitychange', onVisibility);
        ro.disconnect();
        renderer.dispose();
      };
    };

    // Signal ready to React
    window.dispatchEvent(new Event('knightModuleReady'));
  </script>

  <script type="text/babel">

    /* HeroBackground, mounts canvas and calls __initKnight when module is ready */
    function HeroBackground() {
      const canvasRef = React.useRef(null);

      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        let cleanup = null;

        const run = () => {
          if (window.__initKnight) {
            cleanup = window.__initKnight(canvas);
          }
        };

        if (window.__initKnight) {
          run();
        } else {
          window.addEventListener('knightModuleReady', run, { once: true });
        }

        return () => {
          if (cleanup) cleanup();
          window.removeEventListener('knightModuleReady', run);
        };
      }, []);

      return <canvas ref={canvasRef} className="hero-three-canvas" />;
    }

    /* Stock chart line, shoots across hero in GFS green.
       30 points. Story arc: steady choppy climb, big drawdown across
       4 segments (pre-dip high y=280, panic low y=495 - a 215 unit drop),
       4-segment recovery that exceeds the prior high (y=255), then
       a continued uptrend to peak (y=50). Strictly trends up overall. */
    const CHART_PTS = "0,540 60,505 115,525 170,485 230,510 285,460 340,485 395,420 450,445 505,365 560,395 615,310 670,280 710,330 745,400 780,470 810,495 845,450 880,380 915,310 950,255 1000,290 1055,225 1110,255 1170,180 1230,210 1290,130 1345,155 1400,80 1440,50";

              <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">

                <stop offset="100%" stopColor="#94D500" stopOpacity="0"/>
              </linearGradient>
            </defs>
            <polygon className="stock-fill"
              points={CHART_PTS + " 1440,600 0,600"} />
            <polyline className="stock-glow-layer" points={CHART_PTS} />
            <polyline className="stock-line" points={CHART_PTS} />
          </svg>
        </div>
      );
    }

    const PORTALS = [

      { name: 'OneView', role: 'Consolidated wealth view',  href: 'https://oneview.v2020-sai.com/' }
    ];

    function Hero3D() {

                </div>
              </div>
              <div className="hero-portals" id="portals">

                </div>
                <div className="hp-list">
                  {PORTALS.map(p => (
                    <a key={p.name} className="hp-card" href={p.href}
                       target={p.href.startsWith('http') ? '_blank' : undefined} rel="noreferrer">
                      <div className="hp-card-main">
                        <div className="hp-text">
                          <h3>{p.name}</h3>
                          <div className="role">{p.role}</div>
                        </div>
                      </div>
                      <span className="hp-arrow" aria-hidden="true">{ARROW}</span>
                    </a>
                  ))}
                </div>
                <div className="hp-foot">
                  Not sure which to use? <a href="tel:+16517748759">Call 651.774.8759</a>, we'll get you in.
                </div>
              </div>
            </div>
          </div>
          <Swoop />
        </section>
      );
    }

    function App() {
